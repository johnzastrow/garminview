version: 2
updates:
  # "uv", not "pip": the pip ecosystem bumps pyproject.toml alone and leaves
  # uv.lock behind, and the image installs from uv.lock -- so pip-style bumps
  # changed nothing that runs and let the two drift apart (fixed in 0.10.3).
  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      # One PR per week for routine updates instead of one per package. Each
      # closed PR otherwise frees a slot that Dependabot refills at once from
      # its backlog. Major versions still arrive individually for review.
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # garmindb pins sqlalchemy to one exact version per release
      # (3.7.0 -> 2.0.46, 3.9+ -> 2.0.52), so sqlalchemy moves with garmindb;
      # a standalone bump can never resolve.
      - dependency-name: "sqlalchemy"
      # garmindb 3.7.0 bumps its garmin_monitoring schema (6 -> 7) and refuses
      # to sync until that DB is rebuilt from the downloaded files. Hold
      # garmindb until the rebuild is planned; remove this entry to resume.
      - dependency-name: "garmindb"
    labels:
      - "dependencies"
      - "python"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      # Same as /backend: one weekly PR for minor and patch updates.
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # TypeScript 7 is the native (Go) compiler and drops the JS API that
      # vue-tsc loads (typescript/lib/tsc), so `npm run type-check` cannot run
      # on it. Remove this once vue-tsc supports TypeScript 7.
      - dependency-name: "typescript"
        versions: [">=7"]
    labels:
      - "dependencies"
      - "javascript"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "github-actions"
