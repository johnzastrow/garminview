version: 2
updates:
  # "uv", not "pip": the pip ecosystem bumps pyproject.toml alone and leaves
  # uv.lock behind, and the image installs from uv.lock -- so pip-style bumps
  # changed nothing that runs and let the two drift apart (fixed in 0.10.3).
  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "github-actions"
